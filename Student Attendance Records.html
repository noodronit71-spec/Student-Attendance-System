<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --row-hover: #f8fafc;
      --green-bg: #ecfdf5;
      --green-text: #047857;
      --green-border: #a7f3d0;
      --amber-bg: #fffbeb;
      --amber-text: #b45309;
      --amber-border: #fde68a;
      --red-bg: #fef2f2;
      --red-text: #b91c1c;
      --red-border: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      padding: 48px 32px;
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }

    /* 2x Scaled Content Container */
    .report-card {
      width: 100%;
      max-width: 2400px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 60px -15px rgba(15, 23, 42, 0.1), 0 4px 12px -4px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    /* Header */
    .report-header {
      padding: 44px 56px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .report-title h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--primary);
      line-height: 1.15;
    }

    .report-title p {
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .month-control {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 64px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background-color: var(--bg-card);
      font-size: 1.375rem;
      color: var(--text-muted);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .month-control:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .month-control input[type="month"] {
      border: none;
      background: transparent;
      color: var(--primary);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      zoom: 1.5;
    }

    .btn {
      height: 64px;
      padding: 0 24px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--primary);
      font-family: inherit;
      font-size: 1.375rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .btn:hover {
      background-color: var(--bg-page);
      border-color: var(--border-strong);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1e293b;
      border-color: #1e293b;
    }

    /* UX Filter Strip & Quick Stats */
    .toolbar-strip {
      padding: 24px 56px;
      background-color: #fafbfd;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .filter-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-page);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .filter-chip {
      height: 50px;
      padding: 0 20px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter-chip:hover {
      color: var(--primary);
    }

    .filter-chip.active {
      background-color: var(--bg-card);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .quick-metrics {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      font-size: 1.3rem;
      color: var(--text-muted);
    }

    .metric-item strong {
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .metric-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .dot-low {
      background-color: var(--red-text);
    }

    .dot-avg {
      background-color: var(--green-text);
    }

    .notice-bar {
      padding: 18px 56px;
      background-color: var(--amber-bg);
      border-bottom: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 1.35rem;
      font-weight: 500;
      display: none;
    }

    .notice-bar.visible {
      display: block;
    }

    /* Day Strip (1 to 31) */
    .day-strip {
      padding: 20px 56px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .day-strip-label {
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-right: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .day-btn {
      min-width: 48px;
      height: 48px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--bg-page);
      color: var(--primary);
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .day-btn:hover {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .day-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Table (2x Scale) */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: var(--bg-page);
      border-bottom: 2px solid var(--border);
    }

    th {
      padding: 22px 28px;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    td {
      padding: 22px 28px;
      font-size: 1.65rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    tbody tr.row-low {
      background-color: rgba(254, 242, 242, 0.35);
    }

    tbody tr.row-low:hover {
      background-color: rgba(254, 242, 242, 0.65);
    }

    .col-left { text-align: left; }
    .col-center { text-align: center; }

    .sno {
      width: 148px;
      color: var(--text-muted);
      font-size: 1.4rem;
      font-weight: 600;
    }

    .student-cell {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-circle {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background-color: var(--bg-page);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-low {
      background-color: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .student-name {
      font-weight: 600;
      color: var(--primary);
    }

    /* 2x Badges */
    .badge {
      display: inline-block;
      min-width: 96px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 1.35rem;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      border: 1px solid transparent;
    }

    .badge-present {
      background-color: var(--green-bg);
      color: var(--green-text);
      border-color: var(--green-border);
    }

    .badge-warn {
      background-color: var(--amber-bg);
      color: var(--amber-text);
      border-color: var(--amber-border);
    }

    .badge-absent {
      background-color: var(--red-bg);
      color: var(--red-text);
      border-color: var(--red-border);
    }

    .badge-zero {
      background-color: var(--bg-page);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .btn-delete {
      height: 50px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-delete:hover {
      background-color: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .empty-state {
      padding: 56px 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.5rem;
    }

    /* Footer */
    .report-footer {
      padding: 24px 56px;
      background-color: var(--bg-page);
      border-top: 1px solid var(--border);
      font-size: 1.375rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    /* Modal (2x Scale) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 820px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 28px 64px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }

    .modal-header {
      padding: 28px 36px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 2.2rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 8px;
    }

    .modal-body {
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row label {
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .form-row input {
      font-family: inherit;
      font-size: 1.5rem;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--primary);
      background-color: var(--bg-page);
    }

    .form-row input:focus {
      outline: none;
      border-color: var(--accent);
      background-color: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .form-error {
      font-size: 1.3rem;
      color: var(--red-text);
      font-weight: 500;
      min-height: 28px;
    }

    .modal-footer {
      padding: 22px 36px;
      background-color: var(--bg-page);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 14px;
    }
  </style>
</head>
<body>

  <div class="report-card">
    <div class="report-header">
      <div class="report-title">
        <h1>Student Attendance</h1>
        <p id="monthSubtitle">November 2026 · Day 1</p>
      </div>
      <div class="header-controls">
        <label class="month-control" for="monthPicker">
          <span>Month</span>
          <input type="month" id="monthPicker" value="2026-11" max="2026-11">
        </label>
        <button type="button" class="btn btn-primary" id="addStudentBtn">+ Add Student</button>
        <button type="button" class="btn" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="toolbar-strip">
      <div class="filter-group" role="group" aria-label="Filter students by attendance">
        <button type="button" class="filter-chip active" data-filter="all">All Students</button>
        <button type="button" class="filter-chip" data-filter="low">Low Attendance (&lt;75%)</button>
        <button type="button" class="filter-chip" data-filter="good">On Track (≥75%)</button>
      </div>
      <div class="quick-metrics" id="quickMetrics"></div>
    </div>

    <div class="day-strip" id="dayStrip" role="group" aria-label="Select date 1 to 31"></div>

    <div class="notice-bar" id="noticeBar"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="col-center sno">Sr. No.</th>
            <th class="col-left">Student Name</th>
            <th class="col-center">Theory</th>
            <th class="col-center">Practical</th>
            <th class="col-center">Total Attended</th>
            <th class="col-center">Absent</th>
            <th class="col-center">Total Days</th>
            <th class="col-center">Attendance %</th>
            <th class="col-center">Action</th>
          </tr>
        </thead>
        <tbody id="attendanceBody"></tbody>
      </table>
    </div>

    <div class="report-footer">
      <span id="enrolledCount">14 Students</span>
      <span>Attendance % = (Total Attended ÷ Total Days) × 100</span>
    </div>
  </div>

  <!-- Add Student Modal -->
  <div class="modal-backdrop" id="addStudentModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Add Student</h2>
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close">&times;</button>
      </div>
      <form id="addStudentForm">
        <div class="modal-body">
          <div class="form-row">
            <label for="newStudentName">Student Name</label>
            <input type="text" id="newStudentName" placeholder="e.g., Rohan Desai" required>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="newPresentDays">Present Days</label>
              <input type="number" id="newPresentDays" min="0" value="18" required>
            </div>
            <div class="form-row">
              <label for="newAbsentDays">Absent Days</label>
              <input type="number" id="newAbsentDays" min="0" value="2" required>
            </div>
          </div>
          <div class="form-error" id="formError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CURRENT_MONTH = "2026-11";
    const MAX_DAYS = 31;

    // Alternating 20 and 26 working days in chronological month order
    function getWorkingDaysForMonth(ym) {
      const [year, month] = ym.split("-").map(Number);
      const monthIndex = year * 12 + (month - 1);
      const anchorIndex = 2026 * 12 + (11 - 1);
      const diff = monthIndex - anchorIndex;
      return Math.abs(diff) % 2 === 0 ? 20 : 26;
    }

    const ROSTER_NAMES = [
      "Amit Tandel",
      "Ansh Patel",
      "Chandani Patel",
      "Darshil Patel",
      "Dhruv Patel",
      "Dip Patel",
      "Jeet Rathod",
      "Jinal Kanani",
      "Meet Patel",
      "Neel Halpati",
      "Neel Lad",
      "Rahul Gond",
      "Taral Patel",
      "Uday Kukana"
    ];

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function getPreviousMonthKey(ym) {
      const [year, month] = ym.split("-").map(Number);
      const prev = new Date(year, month - 2, 1);
      const py = prev.getFullYear();
      const pm = String(prev.getMonth() + 1).padStart(2, "0");
      return `${py}-${pm}`;
    }

    function pickLowAttendanceIndices(ym, count, previousLowSet = new Set()) {
      const total = ROSTER_NAMES.length;
      const allIndices = Array.from({ length: total }, (_, i) => i);

      const eligible = allIndices.filter(i => !previousLowSet.has(i));
      const pool = eligible.length >= count ? eligible : allIndices;

      const seed = hashString(`low-attendance:${ym}`);
      const ranked = pool
        .map(idx => ({
          idx,
          score: hashString(`${seed}:${idx}`)
        }))
        .sort((a, b) => a.score - b.score);

      return ranked.slice(0, count).map(item => item.idx);
    }

    function generateMonthEntries(ym, totalDays, previousLowSet = new Set()) {
      const lowCount = 2;
      const lowIndices = pickLowAttendanceIndices(ym, lowCount, previousLowSet);
      const lowSet = new Set(lowIndices);

      const entries = ROSTER_NAMES.map((name, idx) => {
        const stuSeed = hashString(`${ym}:${name}:${idx}`);
        const isLow = lowSet.has(idx);

        const minAttended = isLow
          ? Math.max(1, Math.floor(totalDays * 0.55))
          : Math.max(1, Math.ceil(totalDays * 0.85));
        const maxAttended = isLow
          ? Math.max(minAttended, Math.min(totalDays - 1, Math.floor(totalDays * 0.70)))
          : Math.max(minAttended, Math.min(totalDays, Math.ceil(totalDays * 0.95)));

        const span = Math.max(1, maxAttended - minAttended + 1);
        const attended = minAttended + (stuSeed % span);

        const theory = Math.ceil(attended * 0.6);
        const practical = Math.max(0, attended - theory);

        return { name, theory, practical };
      });

      return { entries, lowSet };
    }

    function createInitialRecordsByMonth() {
      const orderedMonths = ["2026-09", "2026-10", "2026-11"];
      const records = {};
      let prevLow = new Set();

      orderedMonths.forEach(ym => {
        const totalDays = getWorkingDaysForMonth(ym);
        const { entries, lowSet } = generateMonthEntries(ym, totalDays, prevLow);
        records[ym] = { totalDays, entries };
        prevLow = lowSet;
      });

      return records;
    }

    let recordsByMonth = createInitialRecordsByMonth();
    let selectedMonth = CURRENT_MONTH;
    let selectedDay = 1;
    let activeFilter = "all";

    const monthPicker = document.getElementById("monthPicker");
    const monthSubtitle = document.getElementById("monthSubtitle");
    const dayStrip = document.getElementById("dayStrip");
    const noticeBar = document.getElementById("noticeBar");
    const attendanceBody = document.getElementById("attendanceBody");
    const enrolledCount = document.getElementById("enrolledCount");
    const quickMetrics = document.getElementById("quickMetrics");
    const addStudentBtn = document.getElementById("addStudentBtn");
    const resetBtn = document.getElementById("resetBtn");
    const filterChips = document.querySelectorAll(".filter-chip");

    monthPicker.max = CURRENT_MONTH;
    monthPicker.value = CURRENT_MONTH;

    // Modal elements
    const modal = document.getElementById("addStudentModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const addStudentForm = document.getElementById("addStudentForm");
    const newStudentName = document.getElementById("newStudentName");
    const newPresentDays = document.getElementById("newPresentDays");
    const newAbsentDays = document.getElementById("newAbsentDays");
    const formError = document.getElementById("formError");

    function renderDayStrip() {
      dayStrip.innerHTML = `<span class="day-strip-label">Date (1–31)</span>`;
      for (let d = 1; d <= MAX_DAYS; d++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `day-btn${d === selectedDay ? " active" : ""}`;
        btn.textContent = String(d);
        btn.setAttribute("aria-pressed", String(d === selectedDay));
        btn.addEventListener("click", () => {
          selectedDay = d;
          renderDayStrip();
          renderTable();
        });
        dayStrip.appendChild(btn);
      }
    }

    function formatMonthLabel(ym) {
      const [year, month] = ym.split("-").map(Number);
      const date = new Date(year, month - 1, 1);
      return date.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }

    function getInitials(name) {
      return name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join("");
    }

    function ensureMonthRecord(ym) {
      if (!recordsByMonth[ym]) {
        const prevKey = getPreviousMonthKey(ym);
        let prevLow = new Set();
        if (recordsByMonth[prevKey]) {
          const prevRec = recordsByMonth[prevKey];
          prevLow = new Set(
            prevRec.entries
              .map((stu, i) => (computeStudentMetrics(stu, prevRec.totalDays).isLow ? i : -1))
              .filter(i => i !== -1)
          );
        }
        const totalDays = getWorkingDaysForMonth(ym);
        const { entries } = generateMonthEntries(ym, totalDays, prevLow);
        recordsByMonth[ym] = {
          totalDays,
          entries
        };
      }
      return recordsByMonth[ym];
    }

    function getPctBadgeClass(pct) {
      if (pct >= 85) return "badge-present";
      if (pct >= 75) return "badge-warn";
      return "badge-absent";
    }

    function getAbsentBadgeClass(absent) {
      return absent === 0 ? "badge-zero" : "badge-absent";
    }

    function showNotice(message) {
      noticeBar.textContent = message;
      noticeBar.classList.add("visible");
    }

    function hideNotice() {
      noticeBar.textContent = "";
      noticeBar.classList.remove("visible");
    }

    function getActiveRecord() {
      return ensureMonthRecord(selectedMonth);
    }

    function computeStudentMetrics(stu, totalDays) {
      const theory = Math.max(0, Number(stu.theory) || 0);
      const practical = Math.max(0, Number(stu.practical) || 0);
      const attended = stu.lockedPresent !== undefined
        ? Math.max(0, Number(stu.lockedPresent) || 0)
        : theory + practical;
      const absent = stu.lockedAbsent !== undefined
        ? Math.max(0, Number(stu.lockedAbsent) || 0)
        : Math.max(0, totalDays - attended);
      const pct = totalDays > 0 ? ((attended / totalDays) * 100).toFixed(1) : "0.0";
      const pctNum = parseFloat(pct);
      const isLow = pctNum < 75;
      return { theory, practical, attended, absent, pct, pctNum, isLow };
    }

    function validateModalInputs() {
      const { totalDays } = getActiveRecord();
      const present = Math.max(0, parseInt(newPresentDays.value, 10) || 0);
      const absent = Math.max(0, parseInt(newAbsentDays.value, 10) || 0);
      const sum = present + absent;

      if (sum > totalDays) {
        formError.textContent = `Present (${present}) + Absent (${absent}) = ${sum} exceeds ${totalDays} working days.`;
      } else {
        formError.textContent = "";
      }
    }

    function openModal() {
      const { totalDays } = getActiveRecord();
      newStudentName.value = "";
      newPresentDays.value = String(Math.max(0, totalDays - 1));
      newAbsentDays.value = "1";
      formError.textContent = "";
      modal.classList.add("open");
      newStudentName.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    function renderTable() {
      const record = getActiveRecord();
      const { totalDays, entries } = record;

      monthSubtitle.textContent = `${formatMonthLabel(selectedMonth)} · Day ${selectedDay} of ${MAX_DAYS} · ${totalDays} Working Days`;

      const computedAll = entries.map((stu, originalIndex) => ({
        stu,
        originalIndex,
        metrics: computeStudentMetrics(stu, totalDays)
      }));

      const lowCount = computedAll.filter(item => item.metrics.isLow).length;
      const goodCount = computedAll.length - lowCount;
      const avgPct = computedAll.length > 0
        ? (computedAll.reduce((acc, item) => acc + item.metrics.pctNum, 0) / computedAll.length).toFixed(1)
        : "0.0";

      quickMetrics.innerHTML = `
        <span class="metric-item"><span class="metric-dot dot-avg"></span>Class Avg: <strong>${avgPct}%</strong></span>
        <span class="metric-item"><span class="metric-dot dot-low"></span>Low Attendance: <strong>${lowCount}</strong></span>
        <span class="metric-item">On Track: <strong>${goodCount}</strong></span>
      `;

      const filtered = computedAll.filter(item => {
        if (activeFilter === "low") return item.metrics.isLow;
        if (activeFilter === "good") return !item.metrics.isLow;
        return true;
      });

      enrolledCount.textContent = activeFilter === "all"
        ? `${entries.length} ${entries.length === 1 ? "Student" : "Students"}`
        : `Showing ${filtered.length} of ${entries.length} Students`;

      attendanceBody.innerHTML = "";

      if (filtered.length === 0) {
        const emptyTr = document.createElement("tr");
        const emptyTd = document.createElement("td");
        emptyTd.colSpan = 9;
        emptyTd.className = "empty-state";
        emptyTd.textContent = "No students match the selected filter for this month.";
        emptyTr.appendChild(emptyTd);
        attendanceBody.appendChild(emptyTr);
        return;
      }

      filtered.forEach(({ stu, originalIndex, metrics }, idx) => {
        const { theory, practical, attended, absent, pct, pctNum, isLow } = metrics;

        const tr = document.createElement("tr");
        if (isLow) tr.classList.add("row-low");

        const tdSno = document.createElement("td");
        tdSno.className = "col-center sno";
        tdSno.textContent = String(idx + 1);

        const tdName = document.createElement("td");
        tdName.className = "col-left";
        const nameWrap = document.createElement("div");
        nameWrap.className = "student-cell";
        const avatar = document.createElement("span");
        avatar.className = `avatar-circle${isLow ? " avatar-low" : ""}`;
        avatar.textContent = getInitials(stu.name);
        const nameSpan = document.createElement("span");
        nameSpan.className = "student-name";
        nameSpan.textContent = stu.name;
        nameWrap.append(avatar, nameSpan);
        tdName.appendChild(nameWrap);

        const tdTheory = document.createElement("td");
        tdTheory.className = "col-center";
        tdTheory.textContent = String(theory);

        const tdPrac = document.createElement("td");
        tdPrac.className = "col-center";
        tdPrac.textContent = String(practical);

        const tdAttended = document.createElement("td");
        tdAttended.className = "col-center";
        tdAttended.textContent = String(attended);

        const tdAbsent = document.createElement("td");
        tdAbsent.className = "col-center";
        tdAbsent.innerHTML = `<span class="badge ${getAbsentBadgeClass(absent)}">${absent}</span>`;

        const tdTotal = document.createElement("td");
        tdTotal.className = "col-center";
        tdTotal.textContent = String(totalDays);

        const tdPct = document.createElement("td");
        tdPct.className = "col-center";
        tdPct.innerHTML = `<span class="badge ${getPctBadgeClass(pctNum)}">${pct}%</span>`;

        const tdAction = document.createElement("td");
        tdAction.className = "col-center";
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-delete";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => {
          entries.splice(originalIndex, 1);
          renderTable();
        });
        tdAction.appendChild(deleteBtn);

        tr.append(tdSno, tdName, tdTheory, tdPrac, tdAttended, tdAbsent, tdTotal, tdPct, tdAction);
        attendanceBody.appendChild(tr);
      });
    }

    filterChips.forEach(chip => {
      chip.addEventListener("click", () => {
        filterChips.forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        activeFilter = chip.dataset.filter;
        renderTable();
      });
    });

    monthPicker.addEventListener("change", (e) => {
      const chosen = e.target.value;
      if (!chosen) return;

      if (chosen > CURRENT_MONTH) {
        monthPicker.value = CURRENT_MONTH;
        selectedMonth = CURRENT_MONTH;
        showNotice("Future month entries are not available. Showing the current month (November 2026).");
        renderTable();
        return;
      }

      hideNotice();
      selectedMonth = chosen;
      renderTable();
    });

    addStudentBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);
    cancelModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    newPresentDays.addEventListener("input", validateModalInputs);
    newAbsentDays.addEventListener("input", validateModalInputs);

    addStudentForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const record = getActiveRecord();
      const name = newStudentName.value.trim();
      const present = Math.max(0, parseInt(newPresentDays.value, 10) || 0);
      const absent = Math.max(0, parseInt(newAbsentDays.value, 10) || 0);

      if (!name) {
        formError.textContent = "Please enter a student name.";
        return;
      }

      if (present + absent > record.totalDays) {
        formError.textContent = `Present (${present}) + Absent (${absent}) cannot exceed ${record.totalDays} working days.`;
        return;
      }

      const theory = Math.ceil(present * 0.6);
      const practical = present - theory;

      record.entries.push({
        name,
        theory,
        practical,
        lockedPresent: present,
        lockedAbsent: absent
      });

      closeModal();
      renderTable();
    });

    resetBtn.addEventListener("click", () => {
      recordsByMonth = createInitialRecordsByMonth();
      selectedMonth = CURRENT_MONTH;
      selectedDay = 1;
      activeFilter = "all";
      filterChips.forEach(c => c.classList.toggle("active", c.dataset.filter === "all"));
      monthPicker.value = CURRENT_MONTH;
      hideNotice();
      renderDayStrip();
      renderTable();
    });

    renderDayStrip();
    renderTable();
  </script>
</body>
</html>
